<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Regex tokenization"><title>Regex tokenization</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">re.findall(r&quot;\w+|[^\w\s]&quot;, text): how the regex scans &quot;I&#x27;m here, ok!&quot;</tspan></text><rect x="20" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="37.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="37.0" dy="0.0">I</tspan></text><rect x="58" y="70" width="34" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="75.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="75.0" dy="0.0">&#x27;</tspan></text><rect x="96" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="113.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="113.0" dy="0.0">m</tspan></text><rect x="134" y="70" width="34" height="30" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="151.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="151.0" dy="0.0">␣</tspan></text><rect x="172" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="189.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="189.0" dy="0.0">h</tspan></text><rect x="210" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="227.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="227.0" dy="0.0">e</tspan></text><rect x="248" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="265.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="265.0" dy="0.0">r</tspan></text><rect x="286" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="303.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="303.0" dy="0.0">e</tspan></text><rect x="324" y="70" width="34" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="341.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="341.0" dy="0.0">,</tspan></text><rect x="362" y="70" width="34" height="30" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="379.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="379.0" dy="0.0">␣</tspan></text><rect x="400" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="417.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="417.0" dy="0.0">o</tspan></text><rect x="438" y="70" width="34" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="455.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="455.0" dy="0.0">k</tspan></text><rect x="476" y="70" width="34" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="493.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="493.0" dy="0.0">!</tspan></text><text x="20" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">blue = \w (letter, digit, _)    orange = neither \w nor whitespace → [^\w\s]    gray = whitespace → matched by nothing, skipped</tspan></text><text x="20" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">matches, left to right:</tspan></text><rect x="20" y="172" width="44" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="42.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="42.0" dy="0.0">I</tspan></text><text x="42.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="42.0" dy="0.0">\w+</tspan></text><rect x="72" y="172" width="56" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="100.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="100.0" dy="0.0">&#x27;</tspan></text><text x="100.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="100.0" dy="0.0">[^\w\s]</tspan></text><rect x="136" y="172" width="44" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="158.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="158.0" dy="0.0">m</tspan></text><text x="158.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="158.0" dy="0.0">\w+</tspan></text><rect x="188" y="172" width="44" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="210.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="210.0" dy="0.0">here</tspan></text><text x="210.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="210.0" dy="0.0">\w+</tspan></text><rect x="240" y="172" width="56" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="268.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="268.0" dy="0.0">,</tspan></text><text x="268.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="268.0" dy="0.0">[^\w\s]</tspan></text><rect x="304" y="172" width="44" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="326.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="326.0" dy="0.0">ok</tspan></text><text x="326.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="326.0" dy="0.0">\w+</tspan></text><rect x="356" y="172" width="56" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="384.0" y="188.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="384.0" dy="0.0">!</tspan></text><text x="384.0" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="384.0" dy="0.0">[^\w\s]</tspan></text><rect x="20" y="240" width="900" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">A | B tries A first, then B, at each position. \w+ is greedy (takes the whole run); [^\w\s] takes exactly one character.</tspan></text></svg>
