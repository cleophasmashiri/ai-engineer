<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="940" height="240" role="img" aria-label="Timing with datetime"><title>Timing with datetime</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="239" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">time_tokenizer(): time the whole loop once, then divide</tspan></text><line x1="40" y1="124" x2="900" y2="124" stroke="#64748b" stroke-width="2"/><rect x="20" y="60" width="161.62" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="100.81" y="74.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="100.81" dy="0.0">start = datetime.now()</tspan></text><line x1="60" y1="86" x2="60" y2="124" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="150" y="108" width="132" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="216.0" y="124.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="216.0" dy="0.0">fn(text)  #1</tspan></text><rect x="300" y="108" width="132" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="366.0" y="124.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="366.0" dy="0.0">fn(text)  #2</tspan></text><rect x="450" y="108" width="132" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="516.0" y="124.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="516.0" dy="0.0">fn(text)  #3</tspan></text><rect x="600" y="108" width="132" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="666.0" y="124.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="666.0" dy="0.0">fn(text)  #4</tspan></text><rect x="730" y="60" width="148.2" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="804.1" y="74.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="804.1" dy="0.0">end = datetime.now()</tspan></text><line x1="800" y1="86" x2="800" y2="124" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="450" dy="0.0">repeats = 4 calls inside ONE timed interval</tspan></text><rect x="20" y="180" width="900" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="470.0" y="202.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="470.0" dy="0.0">avg = (end - start).total_seconds() / repeats      →  return (tokens_from_last_call, avg)</tspan></text></svg>
