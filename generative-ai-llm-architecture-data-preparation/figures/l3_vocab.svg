-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">Counting tokens across a list of lists with a nested generator:</tspan></text><text x="34" y="308" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">Counter(tok for toks in token_lists for tok in toks)</tspan></text></svg>
