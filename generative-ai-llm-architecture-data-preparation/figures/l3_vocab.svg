<tspan x="719.9099999999999" dy="0.0">5</tspan></text><rect x="737.6199999999998" y="92" width="26" height="28" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="750.6199999999998" y="107.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="750.6199999999998" dy="0.0">!</tspan></text><text x="750.6199999999998" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="750.6199999999998" dy="0.0">6</tspan></text><rect x="767.6199999999998" y="92" width="40.84" height="28" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="788.0399999999997" y="107.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="788.0399999999997" dy="0.0">suis</tspan></text><text x="788.0399999999997" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="788.0399999999997" dy="0.0">7</tspan></text><rect x="812.4599999999998" y="92" width="34.129999999999995" height="28" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="829.5249999999999" y="107.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="829.5249999999999" dy="0.0">est</tspan></text><text x="829.5249999999999" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="nor