<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" width="940" height="190" role="img" aria-label="Character tokenization"><title>Character tokenization</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="189" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">char_tokenize(&quot;hi there\n!&quot;): every character, whitespace dropped by default</tspan></text><rect x="20" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="40.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="40.0" dy="0.0">h</tspan></text><rect x="66" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="86.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="86.0" dy="0.0">i</tspan></text><rect x="112" y="70" width="40" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="132.0" dy="0.0">␣</tspan></text><line x1="116" y1="74" x2="148" y2="96" stroke="#dc2626" stroke-width="2"/><rect x="158" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="178.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="178.0" dy="0.0">t</tspan></text><rect x="204" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="224.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="224.0" dy="0.0">h</tspan></text><rect x="250" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="270.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="270.0" dy="0.0">e</tspan></text><rect x="296" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="316.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="316.0" dy="0.0">r</tspan></text><rect x="342" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="362.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="362.0" dy="0.0">e</tspan></text><rect x="388" y="70" width="40" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="408.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="408.0" dy="0.0">\n</tspan></text><line x1="392" y1="74" x2="424" y2="96" stroke="#dc2626" stroke-width="2"/><rect x="434" y="70" width="40" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="454.0" y="86.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="454.0" dy="0.0">!</tspan></text><text x="20" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">c.isspace() is True for &#x27; &#x27;, &#x27;\n&#x27;, &#x27;\t&#x27; → skip them unless keep_spaces=True</tspan></text><text x="20" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">result: [&#x27;h&#x27;, &#x27;i&#x27;, &#x27;t&#x27;, &#x27;h&#x27;, &#x27;e&#x27;, &#x27;r&#x27;, &#x27;e&#x27;, &#x27;!&#x27;]  — a list comprehension with an if-filter</tspan></text></svg>
