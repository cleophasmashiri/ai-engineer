<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-label="Dataset and DataLoader"><title>Dataset and DataLoader</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Dataset = indexable samples; DataLoader = sampler + collate_fn</tspan></text><rect x="20" y="64" width="300" height="220" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="170" y="82" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="170" dy="0.0">class FrenchDataset(Dataset)</tspan></text><text x="34" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">def __init__(self, sentences):</tspan></text><text x="34" y="125" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">    store the list on self</tspan></text><text x="34" y="144" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0"></tspan></text><text x="34" y="163" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">def __len__(self):</tspan></text><text x="34" y="182" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">    → how many samples</tspan></text><text x="34" y="201" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0"></tspan></text><text x="34" y="220" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">def __getitem__(self, idx):</tspan></text><text x="34" y="239" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">    → sample number idx</tspan></text><path d="M322,150 L362,150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="380" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="380" dy="0.0">dataset[i] for the chosen indices</tspan></text><rect x="380" y="100" width="220" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="490.0" y="114.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="490.0" dy="0.0">[0] Ceci est une phrase.</tspan></text><rect x="380" y="132" width="220" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="490.0" y="146.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="490.0" dy="0.0">[1] C&#x27;est un autre…</tspan></text><rect x="380" y="164" width="220" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="490.0" y="178.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="490.0" dy="0.0">[2] Voici une…</tspan></text><rect x="380" y="196" width="220" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="490.0" y="210.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="490.0" dy="0.0">[3] Il fait beau…</tspan></text><text x="490" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="490" dy="0.0">sampler: 0,1,2,3 (or shuffled)</tspan></text><path d="M604,150 L676,150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="640" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="640" dy="0.0">collate_fn</tspan></text><rect x="680" y="100" width="260" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="810" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="810" dy="0.0">batch</tspan></text><text x="694" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="694" dy="0.0">default: list of 4 strings</tspan></text><text x="694" y="170" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="694" dy="0.0">yours: (padded LongTensor,</tspan></text><text x="694" y="188" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="694" dy="0.0">        lengths)</tspan></text><text x="20" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">Subclassing torch.utils.data.Dataset only requires __len__ and __getitem__; DataLoader handles the rest.</tspan></text></svg>
