<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="920" height="290" role="img" aria-label="Fitting a token budget"><title>Fitting a token budget</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="919" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">fit_to_context(): drop the OLDEST exchange until the prompt fits</tspan></text><text x="20" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">len(encode(prompt)) counts tokens; max_tokens is the budget</tspan></text><text x="20" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">attempt 1</tspan></text><rect x="120" y="92" width="137" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="188.5" y="107.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="188.5" dy="0.0">turn 1 (14)</tspan></text><rect x="260" y="92" width="177" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="348.5" y="107.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="348.5" dy="0.0">turn 2 (18)</tspan></text><rect x="440" y="92" width="147" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="513.5" y="107.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="513.5" dy="0.0">turn 3 (15)</tspan></text><rect x="590" y="92" width="117" height="30" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="648.5" y="107.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="648.5" dy="0.0">new msg + Bot: (12)</tspan></text><rect x="730" y="94" width="128.24" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="794.12" y="108.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="794.12" dy="0.0">59 tok ✗ too long</tspan></text><text x="20" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">attempt 2</tspan></text><rect x="120" y="162" width="177" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="208.5" y="177.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="208.5" dy="0.0">turn 2 (18)</tspan></text><rect x="300" y="162" width="147" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="373.5" y="177.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="373.5" dy="0.0">turn 3 (15)</tspan></text><rect x="450" y="162" width="117" height="30" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="508.5" y="177.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="508.5" dy="0.0">new msg + Bot: (12)</tspan></text><rect x="730" y="164" width="101.36000000000001" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="780.6800000000001" y="178.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="780.6800000000001" dy="0.0">45 tok ✓ fits</tspan></text><line x1="600" y1="76" x2="600" y2="232" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="600" y="248" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#dc2626" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="600" dy="0.0">max_tokens = 48</tspan></text><text x="20" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">kept = kept[1:] drops the oldest. If the history is empty and it still doesn&#x27;t fit, return that bare prompt anyway.</tspan></text></svg>
