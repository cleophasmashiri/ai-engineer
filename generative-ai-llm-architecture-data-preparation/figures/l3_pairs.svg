<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Source/target pairs"><title>Source/target pairs</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="979" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">collate_pairs(): two languages, two vocabularies, two paddings</tspan></text><rect x="20" y="70" width="210" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="125.0" y="102.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="125.0" dy="-12.0">batch = [</tspan><tspan x="125.0" dy="12.0"> (&quot;Je t&#x27;adore.&quot;, &quot;I love you.&quot;),</tspan><tspan x="125.0" dy="12.0"> …]</tspan></text><path d="M232,92 L268,80" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><path d="M232,112 L268,150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="270" y="60" width="300" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="420.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="420.0" dy="0.0">tokenize_fr → numericalize(…, src_stoi)</tspan></text><rect x="270" y="130" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="150.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="420.0" dy="0.0">tokenize_en → numericalize(…, tgt_stoi)</tspan></text><path d="M572,80 L610,80" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><path d="M572,150 L610,150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="612" y="60" width="348" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="786.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="786.0" dy="0.0">pad_batch → src_padded (B, Ts), src_lengths</tspan></text><rect x="612" y="130" width="348" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="786.0" y="150.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="786.0" dy="0.0">pad_batch → tgt_padded (B, Tt)</tspan></text><text x="612" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="612" dy="0.0">Ts ≠ Tt in general: each side is padded on its own, with its own &lt;pad&gt; id</tspan></text><text x="20" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Why &lt;bos&gt;/&lt;eos&gt;? Teacher forcing in a seq2seq decoder:</tspan></text><rect x="20" y="236" width="50.6" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="45.3" y="250.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="45.3" dy="0.0">&lt;bos&gt;</tspan></text><rect x="75.6" y="236" width="26" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="88.6" y="250.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="88.6" dy="0.0">I</tspan></text><rect x="106.6" y="236" width="43.28" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="128.24" y="250.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="128.24" dy="0.0">love</tspan></text><rect x="154.88" y="236" width="35.96" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="172.85999999999999" y="250.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="172.85999999999999" dy="0.0">you</tspan></text><rect x="195.84" y="236" width="26" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="208.84" y="250.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="208.84" dy="0.0">.</tspan></text><text x="300" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="300" dy="0.0">tgt[:, :-1]  → decoder INPUT</tspan></text><rect x="74" y="272" width="26" he