<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="Decoding strategies"><title>Decoding strategies</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Choosing the next token: greedy vs beam search vs sampling</tspan></text><text x="20" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">model&#x27;s probabilities for the word after &quot;Tell me about …&quot;</tspan></text><text x="20" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Greedy (default)</tspan></text><text x="20" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">dogs</tspan></text><rect x="90" y="96" width="180.0" height="20" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="276.0" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="276.0" dy="0.0">0.42</tspan></text><text x="20" y="136" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">pets</tspan></text><rect x="90" y="126" width="107.14285714285715" height="20" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="203.14285714285717" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="203.14285714285717" dy="0.0">0.25</tspan></text><text x="20" y="166" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">animals</tspan></text><rect x="90" y="156" width="77.14285714285714" height="20" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="173.14285714285714" y="166" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="173.14285714285714" dy="0.0">0.18</tspan></text><text x="20" y="196" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">cats</tspan></text><rect x="90" y="186" width="42.85714285714286" height="20" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="138.85714285714286" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="138.85714285714286" dy="0.0">0.10</tspan></text><text x="20" y="226" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">friends</tspan></text><rect x="90" y="216" width="21.42857142857143" height="20" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="117.42857142857143" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="117.42857142857143" dy="0.0">0.05</tspan></text><text x="20" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="-6.6">always the top one → deterministic,</tspan><tspan x="20" dy="13.2">same output every run</tspan></text><text x="330" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="330" dy="0.0">Beam search (num_beams=k)</tspan></text><rect x="330" y="140" width="67.76" height="26" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="363.88" y="154.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="363.88" dy="0.0">Tell me…</tspan></text><line x1="400" y1="153" x2="430" y2="113" stroke="#94a3b8" stroke-width="1.5"/><rect x="430" y="100" width="74.48" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="467.24" y="114.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="467.24" dy="0.0">dogs 0.42</tspan></text><line x1="520" y1="113" x2="540" y2="113" stroke="#94a3b8" stroke-width="1.5"/><rect x="540" y="100" width="108.08000000000001" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="594.04" y="114.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="594.04" dy="0.0">… keep growing</tspan></text><line x1="400" y1="153" x2="430" y2="159" stroke="#94a3b8" stroke-width="1.5"/><rect x="430" y="146" width="74.48" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="467.24" y="160.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="467.24" dy="0.0">pets 0.25</tspan></text><line x1="520" y1="159" x2="540" y2="159" stroke="#94a3b8" stroke-width="1.5"/><rect x="540" y="146" width="108.08000000000001" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="594.04" y="160.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="594.04" dy="0.0">… keep growing</tspan></text><line x1="400" y1="153" x2="430" y2="205" stroke="#94a3b8" stroke-width="1.5"/><rect x="430" y="192" width="94.64000000000001" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="477.32" y="206.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="477.32" dy="0.0">animals 0.18</tspan></text><text x="330" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="330" dy="-6.6">keeps the k best partial sentences,</tspan><tspan x="330" dy="13.2">returns the best complete one → deterministic</tspan></text><text x="650" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">Sampling (do_sample=True)</tspan></text><text x="650" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">dogs</tspan></text><rect x="734" y="96" width="140.0" height="20" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="650" y="136" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">pets</tspan></text><rect x="734" y="126" width="83.33333333333334" height="20" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="650" y="166" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">animals</tspan></text><rect x="734" y="156" width="60.0" height="20" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="650" y="196" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">cats</tspan></text><rect x="734" y="186" width="33.333333333333336" height="20" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="650" y="226" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="650" dy="0.0">friends</tspan></text><rect x="734" y="216" width="16.666666666666668" height="20" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="886" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="886" dy="0.0">🎲</tspan></text><text x="650" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="650" dy="-6.6">draws at random ∝ probability</tspan><tspan x="650" dy="13.2">temperature&lt;1 sharpens, top_p trims the tail</tspan></text><rect x="20" y="290" width="900" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="470.0" y="305.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="470.0" dy="0.0">Reproducible sampling: call torch.manual_seed(seed) IMMEDIATELY before the sampling generate() call</tspan></text></svg>
