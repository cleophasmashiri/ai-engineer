ine="middle" xml:space="preserve"><tspan x="790.0" dy="0.0">45</tspan></text><rect x="808" y="77" width="30" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="823.0" y="91.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="823.0" dy="0.0">4</tspan></text><rect x="841" y="77" width="30" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="856.0" y="91.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="856.0" dy="0.0">3</tspan></text><rect x="874" y="77" width="30" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="889.0" y="91.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="889.0" dy="0.0">1</tspan></text><rect x="907" y="77" width="30" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="922.0" y="91.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="922.0" dy="0.0">1</tspan></text><text x="800" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="800" dy="0.0">&lt;pad&gt;=1 up to the batch max</tspan></text><rect x="20" y="160" width="920" height="74" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">Dataset returns raw strings  →  DataLoader groups 4 of them  →  collate_fn does tokenize → numericalize → pad</tspan></text><text x="34" y="206" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">→ one LongTensor of shape (batch=4, T) where T = longest sequence in THIS batch</tspan></text></svg>
