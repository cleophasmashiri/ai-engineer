<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="ChatBot.ask flow"><title>ChatBot.ask flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">ChatBot: state (history) + the functions you already wrote</tspan></text><rect x="20" y="64" width="200" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="120" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="120" dy="0.0">ChatBot</tspan></text><text x="34" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">max_turns</tspan></text><text x="34" y="122" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">max_tokens</tspan></text><text x="34" y="138" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">gen_kwargs  (dict)</tspan></text><text x="34" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">history  (list)</tspan></text><text x="34" y="170" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0"></tspan></text><text x="34" y="186" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">ask(message) → str</tspan></text><text x="34" y="202" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">reset()</tspan></text><rect x="240" y="80" width="80" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="280.0" y="108.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="280.0" dy="0.0">message</tspan></text><path d="M322,108 L334,108" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="336" y="80" width="196" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="434.0" y="108.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="434.0" dy="-6.0">recent = history[-max_turns:]</tspan><tspan x="434.0" dy="12.0">(or [] if max_turns == 0)</tspan></text><path d="M534,108 L546,108" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="548" y="80" width="206" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="651.0" y="108.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="651.0" dy="-6.0">prompt = fit_to_context(</tspan><tspan x="651.0" dy="12.0"> recent, message, max_tokens)</tspan></text><path d="M756,108 L768,108" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="770" y="80" width="166" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="853.0" y="108.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="853.0" dy="-6.0">answer = reply(prompt,</tspan><tspan x="853.0" dy="12.0"> **gen_kwargs)</tspan></text><rect x="560" y="180" width="250" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="685.0" y="200.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="685.0" dy="0.0">history.append((message, answer))</tspan></text><path d="M853,138 C853,180 840,200 812,200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="850" y="180" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="895.0" y="200.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="895.0" dy="-6.6">return</tspan><tspan x="895.0" dy="13.2">answer</tspan></text><path d="M685,222 C700,250 840,250 852,222" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><path d="M558,200 C420,244 300,230 222,176" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="390" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="390" dy="0.0">the next ask() sees this turn</tspan></text><text x="20" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">Store **gen_kwargs from __init__ in an attribute so ask() can forward them, e.g. ChatBot(num_beams=4).</tspan></text></svg>
