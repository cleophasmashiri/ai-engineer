ined(name)</tspan></text><text x="555" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="555" dy="0.0">model.config  ← from config.json</tspan></text><text x="555" y="202" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="555" dy="0.0">  .is_encoder_decoder   .vocab_size</tspan></text><text x="555" y="220" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="555" dy="0.0">  .num_layers  .num_decoder_layers  .d_model</tspan></text><text x="555" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="555" dy="0.0">model.parameters()  ← weight tensors</tspan></text><text x="555" y="266" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="555" dy="0.0">  from model.safetensors</tspan></text><path d="M482,180 L538,210" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/></svg>
