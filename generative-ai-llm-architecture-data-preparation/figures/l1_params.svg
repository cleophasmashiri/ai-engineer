<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Counting parameters"><title>Counting parameters</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="899" height="229" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Counting parameters: every weight is a tensor, numel() counts its numbers</tspan></text><rect x="20" y="70" width="210" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="125" y="88" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="125" dy="0.0">shared.weight</tspan></text><text x="125" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="125" dy="0.0">shape (32128 × 512)</tspan></text><text x="125" y="136" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d4ed8" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="125" dy="0.0">p.numel() = 16,449,536</tspan></text><rect x="242" y="70" width="210" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="347" y="88" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="347" dy="0.0">encoder…SelfAttention.q.weight</tspan></text><text x="347" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="347" dy="0.0">shape (384 × 512)</tspan></text><text x="347" y="136" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d4ed8" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="347" dy="0.0">p.numel() = 196,608</tspan></text><rect x="464" y="70" width="210" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="569" y="88" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="569" dy="0.0">…relative_attention_bias</tspan></text><text x="569" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="569" dy="0.0">shape (32 × 6)</tspan></text><text x="569" y="136" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d4ed8" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="569" dy="0.0">p.numel() = 192</tspan></text><text x="692" y="113" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="692" dy="0.0">+ … (190 tensors)</tspan></text><path d="M450,160 L450,186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="250" y="188" width="400" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="450.0" y="204.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="0.0">n_params = Σ p.numel() for p in model.parameters()</tspan></text></svg>
