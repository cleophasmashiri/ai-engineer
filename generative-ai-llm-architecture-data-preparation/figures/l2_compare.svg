<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Comparing tokenizers"><title>Comparing tokenizers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="999" height="269" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">compare_tokenizers(): one row (dict) per tokenizer, in sorted-name order</tspan></text><rect x="20" y="70" width="210" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="125.0" y="92.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="125.0" dy="0.0">for name in sorted(tokenizers)</tspan></text><path d="M232,92 L250,92" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="252" y="70" width="250" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="377.0" y="92.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="377.0" dy="-6.0">tokens, secs = time_tokenizer(</tspan><tspan x="377.0" dy="12.0">   tokenizers[name], text, repeats)</tspan></text><path d="M504,92 L524,92" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="526" y="62" width="456" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="536" y="76" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#0f172a" f