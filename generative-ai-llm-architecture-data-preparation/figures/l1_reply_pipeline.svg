<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 250" width="990" height="250" role="img" aria-label="reply() pipeline"><title>reply() pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="989" height="249" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">reply(): tokenize → generate → decode</tspan></text><rect x="20" y="70" width="110" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="75.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="75.0" dy="0.0">prompt (str)</tspan></text><path d="M132,101 L148,101" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="70" width="180" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="240.0" dy="-6.6">tokenizer(prompt,</tspan><tspan x="240.0" dy="13.2"> return_tensors=&quot;pt&quot;)</tspan></text><text x="240.0" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="240.0" dy="0.0">→ {input_ids, attention_mask}</tspan></text><path d="M332,101 L348,101" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="350" y="70" width="250" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="475.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="475.0" dy="-6.6">model.generate(**inputs,</tspan><tspan x="475.0" dy="13.2"> max_new_tokens=…, **gen_kwargs)</tspan></text><text x="475.0" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="475.0" dy="0.0">→ tensor([[0, 1692, 1]])</tspan></text><path d="M602,101 L618,101" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="620" y="70" width="210" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="725.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="725.0" dy="-6.6">tokenizer.decode(out[0],</tspan><tspan x="725.0" dy="13.2"> skip_special_tokens=True)</tspan></text><text x="725.0" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="725.0" dy="0.0">→ &quot;blue&quot;</tspan></text><path d="M832,101 L848,101" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="850" y="70" width="90" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="895.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="895.0" dy="0.0">.strip()</tspan></text><rect x="20" y="178" width="950" height="58" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">** unpacks a dict into keyword arguments:</tspan></text><text x="34" y="218" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">inputs = {&quot;input_ids&quot;: …, &quot;attention_mask&quot;: …}   generate(**inputs, num_beams=4)  ≡  generate(input_ids=…, attention_mask=…, num_beams=4)</tspan></text></svg>
