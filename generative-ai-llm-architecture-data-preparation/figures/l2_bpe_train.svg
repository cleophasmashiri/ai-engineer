<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="940" height="240" role="img" aria-label="Training BPE"><title>Training BPE</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="239" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">train_bpe(): repeat find → merge, recording every merge</tspan></text><rect x="20" y="90" width="236" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="138.0" y="115.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="138.0" dy="0.0">wf = corpus_to_word_freqs(words)</tspan></text><path d="M258,115 L282,115" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="284" y="90" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="384.0" y="115.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="384.0" dy="0.0">pair = most_frequent_pair(wf)</tspan></text><path d="M486,115 L532,115" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="509.0" y="105.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="509.0" dy="0.0">pair found</tspan></text><rect x="534" y="90" width="180" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="624.0" y="115.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="624.0" dy="-6.0">merges.append(pair)</tspan><tspan x="624.0" dy="12.0">wf = merge_pair(pair, wf)</tspan></text><path d="M624,142 C624,190 384,190 384,142" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="486" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="486" dy="0.0">repeat up to num_merges times</tspan></text><path d="M384,88 C384,60 820,60 820,94" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="560" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="560" dy="0.0">pair is None → break early</tspan></text><rect x="740" y="96" width="180" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="830.0" y="121.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="830.0" dy="0.0">return (merges, wf)</tspan></text></svg>
