<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-label="collate_fn"><title>collate_fn</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="229" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">collate_fn(batch): the glue that DataLoader calls for every batch</tspan></text><rect x="20" y="70" width="170" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="105.0" y="105.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="105.0" dy="-13.2">batch = [</tspan><tspan x="105.0" dy="13.2"> &quot;Je t&#x27;adore.&quot;,</tspan><tspan x="105.0" dy="13.2"> &quot;Bonjour !&quot; ]</tspan></text><path d="M192,105 L222,105" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="224" y="64" width="300" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="374" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="374" dy="0.0">for each sentence s:</tspan></text><text x="238" y="104" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="238" dy="0.0">numericalize(tokenize_fr(s), stoi)</tspan></text><text x="238" y="126" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="238" dy="0.0">→ [2,5,109,45,4,3]   [2,31,6,3]</tspan></text><path d="M526,105 L556,105" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="558" y="76" width="140" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="628.0" y="105.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="628.0" dy="-6.6">pad_batch(seqs,</tspan><tspan x="628.0" dy="13.2"> PAD_IDX)</tspan></text><path d="M700,105 L730,105" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="732" y="64" width="208" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="836.0" y="105.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="836.0" dy="-6.6">(padded (2, 6),</tspan><tspan x="836.0" dy="13.2"> lengths [6, 4])</tspan></text><rect x="20" y="170" width="920" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="480.0" y="190.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="480.0" dy="0.0">DataLoader(dataset, batch_size=4, collate_fn=collate_fn)  — pass the function itself, don&#x27;t call it</tspan></text></svg>
