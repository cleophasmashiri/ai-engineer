<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" role="img" aria-label="Tokenization round trip"><title>Tokenization round trip</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="979" height="249" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">encode() and decode(): text ⇄ token ids</tspan></text><rect x="20" y="76" width="150" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="95.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="95.0" dy="0.0">&quot;Hello world&quot;</tspan></text><path d="M172,96 L226,96" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="199.0" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="199.0" dy="0.0">tokenize</tspan></text><rect x="230" y="83" width="57.92" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="258.96" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="258.96" dy="0.0">▁Hello</tspan></text><rect x="292.92" y="83" width="57.92" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="321.88" y="97.0" font-family="Menlo, Consola