1</tspan></text><text x="528" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="528" dy="0.0">tokenizer(text)[&quot;input_ids&quot;] → plain list [8774, 296, 1]</tspan></text><text x="230" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="230" dy="0.0">▁ = a space came before this piece</tspan></text><rect x="230" y="168" width="56" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="258.0" y="182.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="258.0" dy="0.0">0</tspan></text><rect x="291" y="168" width="56" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="319.0" y="182.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="319.0" dy="0.0">8774</tspan></text><rect x="352" y="168" width="56" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="380.0" y="182.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="380.0" dy="0.0">296</tspan></text><rect x="413" y="168" width="56" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="441.0" y="182.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="441.0" dy="0.0">1</tspan></text><text x="486" y="181" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="486" dy="0.0">tokenizer.decode(ids, skip_special_tokens=True)</tspan></text><path d="M808,181 L836,181" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="842" y="181" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="842" dy="0.0">&quot;Hello world&quot;</tspan></text><text x="230" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="230" dy="0.0">special tokens (orange): 0 = &lt;pad&gt;, 1 = &lt;/s&gt; (end of sequence)  → dropped by skip_special_tokens</tspan></text><text x="486" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="486" dy="0.0">works on a list or a 1-D tensor</tspan></text></svg>
