<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Greedy decoding loop"><title>Greedy decoding loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="919" height="399" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Greedy decoding, one token per iteration</tspan></text><text x="20" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">prompt: &quot;Answer the question: What color is the sky?&quot;</tspan></text><rect x="20" y="70" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="120.0" y="92.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="120.0" dy="0.0">input_ids  (1, n)</tspan></text><path d="M222,92 L262,92" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="264" y="70" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="339.0" y="92.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="339.0" dy="0.0">Encoder</tspan></text><text x="339" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="339" dy="0.0">(runs inside every model(...) call)</tspan></text><text x="20" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">decoder_input_ids</tspan></text><text x="330" y="160" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="330" dy="0.0">model(input_ids=…, decoder_input_ids=…).logits</tspan></text><text x="690" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="690" dy="0.0">argmax of LAST position</tspan></text><text x="20" y="193" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">step 1</tspan></text><rect x="70" y="180" width="56" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="98.0" y="194.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="98.0" dy="0.0">0</tspan></text><path d="M133,193 L326,193" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="176" width="200" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="430.0" y="193.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="430.0" dy="0.0">logits (1, 1, 32128)</tspan></text><path d="M532,193 L686,193" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="609.0" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="609.0" dy="0.0">logits[0, -1].argmax()</tspan></text><rect x="690" y="180" width="200" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="790.0" y="194.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="790.0" dy="0.0">1692  &#x27;▁blue&#x27;</tspan></text><text x="20" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">step 2</tspan></text><rect x="70" y="260" width="56" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="98.0" y="274.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="98.0" dy="0.0">0</tspan></text><rect x="131" y="260" width="56" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="159.0" y="274.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="159.0" dy="0.0">1692</tspan></text><path d="M194,273 L326,273" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="256" width="200" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="430.0" y="273.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="430.0" dy="0.0">logits (1, 2, 32128)</tspan></text><path d="M532,273 L686,273" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="609.0" y="262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="609.0" dy="0.0">logits[0, -1].argmax()</tspan></text><rect x="690" y="260" width="200" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="790.0" y="274.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="790.0" dy="0.0">1  &#x27;&lt;/s&gt;&#x27;  → stop</tspan></text><path d="M790,208 C790,236 300,226 190,256" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="250" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="250" dy="0.0">append: torch.cat([dec, next_id], dim=1)</tspan></text><rect x="20" y="318" width="880" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="334" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">Loop recipe</tspan></text><text x="34" y="354" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">dec = [[decoder_start_token_id]] (=0)  →  repeat ≤ max_new_tokens:  forward  →  argmax(last)  →  append  →  break if it was eos (=1)</tspan></text><text x="34" y="374" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">finally: tokenizer.decode(dec[0], skip_special_tokens=True)  →  &quot;blue&quot;</tspan></text></svg>
