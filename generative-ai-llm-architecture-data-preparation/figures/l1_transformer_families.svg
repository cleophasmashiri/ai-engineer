<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="The three Transformer families"><title>The three Transformer families</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="899" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">The three Transformer families</tspan></text><text x="20" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">Same building blocks (attention + feed-forward), wired differently</tspan></text><rect x="20" y="64" width="270" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="79.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.0" dy="0.0">Encoder-only</tspan></text><text x="155.0" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.0" dy="0.0">BERT, RoBERTa</tspan></text><rect x="35" y="130" width="240" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="155.0" y="146.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.0" dy="0.0">text: the whole sentence</tspan></text><rect x="35" y="186" width="240" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="207.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.0" dy="-7.2">Encoder</tspan><tspan x="155.0" dy="14.4">(every token sees every token)</tspan></text><path d="M155,162 L155,184" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="35" y="252" width="240" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="155.0" y="273.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.0" dy="-7.2">one vector per token</tspan><tspan x="155.0" dy="14.4">→ classify / embed / search</tspan></text><path d="M155,228 L155,250" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="315" y="64" width="270" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="450.0" y="79.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="0.0">Decoder-only</tspan></text><text x="450.0" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="0.0">GPT, Llama, Qwen</tspan></text><rect x="330" y="130" width="240" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="450.0" y="146.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="0.0">prompt</tspan></text><rect x="330" y="186" width="240" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="450.0" y="207.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="-7.2">Decoder</tspan><tspan x="450.0" dy="14.4">(each token sees only the past)</tspan></text><path d="M450,162 L450,184" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="252" width="240" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="450.0" y="273.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="450.0" dy="0.0">next token → append → repeat</tspan></text><path d="M450,228 L450,250" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="610" y="64" width="270" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="745.0" y="79.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">Encoder-decoder</tspan></text><text x="745.0" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">T5, FLAN-T5, BART, BlenderBot</tspan></text><rect x="625" y="130" width="240" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="745.0" y="146.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">input text (prompt)</tspan></text><rect x="620" y="186" width="118" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="679.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="679.0" dy="-7.2">Encoder</tspan><tspan x="679.0" dy="14.4">reads prompt once</tspan></text><rect x="752" y="186" width="118" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="811.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="811.0" dy="-7.2">Decoder</tspan><tspan x="811.0" dy="14.4">writes answer</tspan></text><path d="M679,162 L679,184" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><path d="M738,212 L750,212" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="745" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="745" dy="0.0">cross-attention</tspan></text><rect x="625" y="262" width="240" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="745.0" y="278.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">output text, token by token</tspan></text><path d="M811,238 L811,260" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="792" y="36" width="75.60000000000001" height="22" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/><text x="829.8" y="48.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="829.8" dy="0.0">← this lab</tspan></text></svg>
