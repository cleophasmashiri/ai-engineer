<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Token frequencies"><title>Token frequencies</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="259" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">token_frequencies(): filter → count → sort → cut</tspan></text><rect x="20" y="70" width="140" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="90.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="90.0" dy="0.0">tokens</tspan></text><text x="90.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="90.0" dy="0.0">[&quot;The&quot;,&quot;cat&quot;,&quot;,&quot;,&quot;the&quot;,…]</tspan></text><path d="M161,97 L172,97" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="172" y="70" width="140" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="242.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="242.0" dy="0.0">lowercase?</tspan></text><text x="242.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="242.0" dy="0.0">[t.lower() for t in …]</tspan></text><path d="M313,97 L324,97" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="70" width="140" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="394.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="394.0" dy="0.0">drop_punct?</tspan></text><text x="394.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="394.0" dy="0.0">keep t if re.search(r&quot;\w&quot;, t)</tspan></text><path d="M465,97 L476,97" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="476" y="70" width="140" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="546.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="546.0" dy="0.0">Counter(...)</tspan></text><text x="546.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="546.0" dy="0.0">{&#x27;the&#x27;: 3, &#x27;cat&#x27;: 2, …}</tspan></text><path d="M617,97 L628,97" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="628" y="70" width="140" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="698.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="698.0" dy="-6.6">sorted(items,</tspan><tspan x="698.0" dy="13.2"> key=(-count, token))</tspan></text><text x="698.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="698.0" dy="0.0">count ↓, then A→Z</tspan></text><path d="M769,97 L780,97" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="780" y="70" width="140" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="850.0" y="97.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="850.0" dy="0.0">[:top_n]</tspan></text><text x="850.0" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="850.0" dy="0.0">if top_n is not None</tspan></text><rect x="20" y="172" width="920" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">Sorting by two criteria: use a key that returns a tuple. Negate the count so bigger counts come first.</tspan></text><text x="34" y="218" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">sorted([(&#x27;b&#x27;, 1), (&#x27;a&#x27;, 2), (&#x27;c&#x27;, 2)], key=lambda kv: (-kv[1], kv[0]))  →  [(&#x27;a&#x27;, 2), (&#x27;c&#x27;, 2), (&#x27;b&#x27;, 1)]</tspan></text></svg>
