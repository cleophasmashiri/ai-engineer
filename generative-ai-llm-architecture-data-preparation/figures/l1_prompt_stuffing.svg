<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="Prompt stuffing"><title>Prompt stuffing</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="919" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">format_prompt(): the model has no memory, so we resend the recent history</tspan></text><text x="20" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">history = list of (user, bot) tuples, oldest first   —   example with max_turns = 2</tspan></text><rect x="20" y="80" width="186" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="113.0" y="109.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="113.0" dy="-6.0">(&quot;Hi&quot;,</tspan><tspan x="113.0" dy="12.0"> &quot;Hello!&quot;)</tspan></text><text x="113" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="113" dy="0.0">history[0]  /  history[-3]</tspan></text><rect x="220" y="80" width="186" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="313.0" y="109.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="313.0" dy="-6.0">(&quot;I&#x27;m Sam&quot;,</tspan><tspan x="313.0" dy="12.0"> &quot;Nice to meet you, Sam.&quot;)</tspan></text><text x="313" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="313" dy="0.0">history[1]  /  history[-2]</tspan></text><rect x="420" y="80" width="186" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="513.0" y="109.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="513.0" dy="-6.0">(&quot;I like jazz&quot;,</tspan><tspan x="513.0" dy="12.0"> &quot;Jazz is great.&quot;)</tspan></text><text x="513" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="513" dy="0.0">history[2]  /  history[-1]</tspan></text><line x1="222" y1="168" x2="606" y2="168" stroke="#2563eb" stroke-width="2"/><text x="414" y="182" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d4ed8" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="414" dy="0.0">history[-2:]  → the last 2 exchanges</tspan></text><rect x="640" y="70" width="260" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="654" y="88" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#14532d" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">User: I&#x27;m Sam</tspan></text><text x="654" y="109" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#14532d" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">Bot: Nice to meet you, Sam.</tspan></text><text x="654" y="130" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#14532d" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">User: I like jazz</tspan></text><text x="654" y="151" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#14532d" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">Bot: Jazz is great.</tspan></text><text x="654" y="172" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9a3412" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">User: What is my name?</tspan></text><text x="654" y="193" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9a3412" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="654" dy="0.0">Bot:</tspan></text><path d="M608,110 L638,110" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="770" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="770" dy="0.0">&quot;\n&quot;.join(lines)  — ends with &quot;Bot:&quot; (no trailing space)</tspan></text><rect x="20" y="262" width="880" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">⚠ Python gotcha: history[-0:] is history[0:], the WHOLE list, not an empty one.</tspan></text><text x="34" y="300" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="34" dy="0.0">So handle max_turns = 0 separately:  kept = history[-max_turns:] if max_turns &gt; 0 else []</tspan></text></svg>
