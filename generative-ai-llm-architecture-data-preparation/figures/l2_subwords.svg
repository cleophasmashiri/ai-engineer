<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Subword markers"><title>Subword markers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">merge_subwords(): two conventions for word boundaries</tspan></text><text x="20" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">WordPiece (BERT): ## = glue onto the previous word</tspan></text><rect x="20" y="84" width="28.64" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="34.32" y="98.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="34.32" dy="0.0">un</tspan></text><rect x="53.64" y="84" width="50.6" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="78.94" y="98.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="78.94" dy="0.0">##bel</tspan></text><rect x="109.24000000000001" y="84" width="43.28" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="130.88" y="98.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anc