ily="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="66.64" dy="0.0">&#x27;</tspan></text><rect x="84.64" y="184" width="26" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="97.64" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="97.64" dy="0.0">m</tspan></text><rect x="115.64" y="184" width="79.88" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="155.57999999999998" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="155.57999999999998" dy="0.0">▁learning</tspan></text><rect x="200.51999999999998" y="184" width="57.92" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="229.48" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="229.48" dy="0.0">▁token</tspan></text><rect x="263.44" y="184" width="65.24000000000001" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="296.06" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="296.06" dy="0.0">ization</tspan></text><rect x="333.68" y="184" width="26" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="346.68" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="346.68" dy="0.0">!</tspan></text><path d="M500,197 L540,197" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="550" y="184" width="35.96" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="567.98" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="567.98" dy="0.0">I&#x27;m</tspan></text><rect x="590.96" y="184" width="72.56" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="627.24" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="627.24" dy="0.0">learning</tspan></text><rect x="668.52" y="184" width="109.16" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="723.1" y="198.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="723.1" dy="0.0">tokenization!</tspan></text><text x="20" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">starts with ▁ → words.append(t[1:])       otherwise → words[-1] += t   (or append if words is empty)</tspan></text><text x="20" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">blue = starts a word, purple = continues one. Any other scheme name → raise ValueError(...)</tspan></text></svg>
