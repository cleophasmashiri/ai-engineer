serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="186" dy="0.0">✔ tiny vocabulary, nothing is ever unknown   ✘ long sequences, little meaning per token</tspan></text><rect x="20" y="242" width="150" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="95.0" y="259.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="95.0" dy="0.0">Subword-based</tspan></text><rect x="186" y="246" width="28.64" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="200.32" y="260.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="200.32" dy="0.0">un</tspan></text><rect x="218.64" y="246" width="72.56" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="254.92" y="260.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="254.92" dy="0.0">##believ</tspan></text><rect x="295.2" y="246" width="57.92" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="324.15999999999997" y="260.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="324.15999999999997" dy="0.0">##ably</tspan></text><rect x="357.12" y="246" width="35.96" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="375.1" y="260.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="no