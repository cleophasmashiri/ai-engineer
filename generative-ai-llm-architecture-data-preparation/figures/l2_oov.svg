<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" role="img" aria-label="Out-of-vocabulary rate"><title>Out-of-vocabulary rate</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="939" height="269" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="20" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="20" dy="0.0">vocab_and_oov(): which test tokens has the model never seen?</tspan></text><rect x="20" y="70" width="260" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="150" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="150" dy="0.0">train vocabulary = set(train_tokens)</tspan></text><rect x="36" y="112" width="40" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="56.0" y="126.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="56.0" dy="0.0">a</tspan></text><rect x="81" y="112" width="40" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="101.0" y="126.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="101.0" dy="0.0">b</tspan></text><text x="36" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="36" dy="-6.6">train_tokens = [&#x27;a&#x27;, &#x27;b&#x27;, &#x27;a&#x27;]</tspan><tspan x="36" dy="13.2">→ distinct: {&#x27;a&#x27;, &#x27;b&#x27;} → vocab_size = 2</tspan></text><text x="320" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan x="320" dy="0.0">test_tokens (repeats count!)</tspan></text><rect x="320" y="104" width="44" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="342.0" y="120.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="342.0" dy="0.0">a</tspan></text><text x="342" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="342" dy="0.0">in</tspan></text><rect x="372" y="104" width="44" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="394.0" y="120.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="394.0" dy="0.0">c</tspan></text><text x="394" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="394" dy="0.0">OOV</tspan></text><rect x="424" y="104" width="44" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="446.0" y="120.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="446.0" dy="0.0">c</tspan></text><text x="446" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="446" dy="0.0">OOV</tspan></text><rect x="476" y="104" width="44" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="498.0" y="120.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="498.0" dy="0.0">b</tspan></text><text x="498" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="498" dy="0.0">in</tspan></text><rect x="560" y="80" width="360" height="90" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="740" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="740" dy="0.0">oov_rate = missing / len(test_tokens)</tspan></text><text x="740" y="132" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan x="740" dy="0.0">= 2 / 4 = 0.5</tspan></text><text x="740" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#475569" font-weight="normal" text-anchor="middle" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="740" dy="0.0">empty test list → return 0.0 (avoid dividing by 0)</tspan></text><text x="20" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-style="italic"><tspan x="20" dy="0.0">Word vocabularies miss new words (high OOV). Character vocabularies almost never miss. Subwords aim for both.</tspan></text></svg>
